# Supabase PostgreSQL Configuration Profile
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:db.your-supabase-project.supabase.co}:5432/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:your-supabase-password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
