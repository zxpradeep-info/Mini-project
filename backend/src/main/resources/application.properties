# Server Port
server.port=8080

# Application Name
spring.application.name=portal-backend

# =======================================================
# Database Configuration (Supabase PostgreSQL)
# =======================================================
# By default, reads environment variables for Supabase connection.
# Example Supabase URL:
# jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:placementdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for offline debugging, available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# =======================================================
# JWT Security Configuration
# =======================================================
# 256-bit secure key
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.placement.portal=INFO
logging.level.org.springframework.security=WARN
